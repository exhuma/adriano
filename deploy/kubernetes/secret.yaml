# PLACEHOLDERS ONLY. Replace every value before applying, and do not
# commit real values. Prefer an external secret manager (External
# Secrets Operator, Vault, a cloud secret store) or Sealed Secrets, so
# the real values never live in Git; this file then only documents
# which keys the Secret must contain.
apiVersion: v1
kind: Secret
metadata:
  name: adriano
  labels:
    app.kubernetes.io/name: adriano
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: adriano
type: Opaque
stringData:
  # Required. Plain postgresql:// DSN. Keep sslmode=require (or
  # verify-full) for a database outside the cluster.
  ADRIANO_DATABASE_URL: "postgresql://adriano:CHANGE-ME@postgres.example.com:5432/adriano?sslmode=require"
  # Required with OIDC. Client secret of the confidential OIDC client
  # (see docs/operator/authentication.rst).
  ADRIANO_OIDC_CLIENT_SECRET: "CHANGE-ME-oidc-client-secret"
  # Required. Fernet key encrypting the server-side sessions; generate
  # with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # Rotating it signs every user out.
  ADRIANO_SESSION_KEY: "CHANGE-ME-fernet-key"
  # Secrets that catalog.yaml refers to by NAME (token_env and
  # push_tokens_env). Keep these names in step with your catalog.
  # Only needed for a gitlab source (token_env).
  ADRIANO_GITLAB_TOKEN_PLATFORM: "CHANGE-ME-gitlab-access-token"
  ADRIANO_PUSH_TOKEN_PLATFORM: "CHANGE-ME-long-random-token"
