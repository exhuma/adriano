# adriano deployment stack: `db` (bundled PostgreSQL) and `adriano`
# (the single image serving API and web UI). See
# docs/operator/configuration.rst for every setting and README.md /
# Taskfile.yml (`task demo`) for a one-command local demo. Do not
# confuse this stack with the ephemeral dev/test database started by
# `task db:up` (container `adriano-db`, host port 55432): this stack's
# `db` service is independent and uses a named volume.
#
# Project name is pinned so this stack never collides with another
# compose project on the same Docker host. The demo tasks override it
# (`-p adriano-demo`) so `task demo:down` can never delete a real
# deployment's volume.
name: adriano

services:
  db:
    # Drop this service (and the depends_on below) when you use an
    # external PostgreSQL: set ADRIANO_DATABASE_URL in your env file.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ADRIANO_DB_USER:-adriano}
      POSTGRES_PASSWORD: ${ADRIANO_DB_PASSWORD:-adriano}
      POSTGRES_DB: ${ADRIANO_DB_NAME:-adriano}
    volumes:
      - adriano-db-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${ADRIANO_DB_USER:-adriano} -d ${ADRIANO_DB_NAME:-adriano}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  adriano:
    # `build` + `image`: `docker compose build` builds the root
    # Dockerfile and tags the result with the `image` name, while
    # `docker compose pull` (operators) fetches that same name from
    # GHCR. `up` uses a local or pulled image first and builds only
    # when neither exists.
    build: .
    image: ghcr.io/exhuma/adriano:${ADRIANO_IMAGE_TAG:-edge}
    restart: unless-stopped
    # ALL application settings come from env files, never from an
    # `environment:` block, so nothing here can silently override
    # what the operator configured. Later files win: the committed
    # defaults first, then the operator's file (default ./.env;
    # `task demo` points it at the generated .env.demo). Catalog-
    # referenced secrets (ADRIANO_GITLAB_TOKEN_* for gitlab sources,
    # ADRIANO_PUSH_TOKEN_*, ...) belong in that file as well.
    env_file:
      - path: ./deploy/compose.defaults.env
        required: true
      - path: ${ADRIANO_BACKEND_ENV_FILE:-.env}
        required: false
    volumes:
      # Read-only: the catalog and the demo's filesystem source.
      # Point ADRIANO_CATALOG_FILE_HOST at your own catalog.yaml for a
      # non-demo deployment (see docs/operator/catalog-file.rst).
      - ${ADRIANO_CATALOG_FILE_HOST:-./catalog.demo.yaml}:/app/catalog.yaml:ro
      # Only catalog.demo.yaml reads this (its filesystem source root
      # is samples/adr-root). A real deployment mounts its own
      # filesystem source trees instead, e.g. in a
      # docker-compose.override.yml (see docs/operator/sources.rst).
      - ./samples:/app/samples:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host 8000 and 8080 are commonly already in use on a dev
      # machine; this stack publishes on 8180 instead.
      - "${ADRIANO_PORT:-8180}:8000"

volumes:
  adriano-db-data:
