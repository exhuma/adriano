[project]
name = "adriano-backend"
version = "2026.10.21a1"
description = "ADR governance catalog backend (adriano)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
adriano = "app.cli:run"

[dependency-groups]
dev = [
    "hypothesis>=6.170.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
docs = [
    "furo>=2024.8.6",
    "sphinx>=8.1",
    "sphinx-autodoc-typehints>=3.0",
    "sphinxcontrib-mermaid>=1.0",
    "sphinxcontrib-openapi>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# fastapi.testclient re-exports starlette.testclient, which warns that
# its httpx backend is deprecated in favour of httpx2. Nothing to act
# on until FastAPI's TestClient moves; keep the test output readable.
filterwarnings = [
    # StarletteDeprecationWarning subclasses UserWarning.
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "C90", "B", "UP"]
# D203/D211 and D212/D213 are mutually exclusive style choices; keep
# the opening triple-quote alone on its own line, summary on the next
# line (matches the quartermaster module-fastapi/code-style examples).
ignore = ["D211", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern calls Depends()/Query() etc.
# in argument defaults by design; treat them as immutable.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]
"alembic/*" = ["D100", "D103", "D401"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
