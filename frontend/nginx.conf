# nginx server block for the adriano SPA (module-runtime-config-spa:
# one built image, configured per environment at container start).
#
# Proxies only the API surfaces the SPA needs: /api/, /healthz, and
# the dev-only token endpoint /auth/dev/ (never /auth/callback, which
# is the SPA's own OIDC redirect route and must fall through to the
# SPA fallback below).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (X-Content-Type-Options, Referrer-Policy, CSP)
    # live in a snippet rendered at container start, because the CSP
    # must allow the OIDC provider's origin (OIDC_AUTHORITY); see
    # security-headers.conf.template. TLS itself terminates at the
    # ingress/load balancer in front of this container (see
    # docs/operator.md "TLS"). Every location below that sets its own
    # add_header must include the snippet again (nginx does not merge
    # add_header across levels).
    include /etc/nginx/adriano-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json
        image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Rendered at container start from config.template.js (see
    # docker-entrypoint.d/40-render-app-config.sh); must never be
    # cached so a redeploy with new env vars is picked up immediately.
    location = /config.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/adriano-security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/adriano-security-headers.conf;
    }

    # Vite's hashed build output (/assets/<name>-<hash>.<ext>) is safe
    # to cache for a long time: a content change always gets a new
    # hashed filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable"
            always;
        include /etc/nginx/adriano-security-headers.conf;
    }

    location /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dev-only token mint endpoint. Scoped to /auth/dev/ only, never
    # all of /auth/, so /auth/callback (the SPA's own OIDC redirect
    # route, served by the fallback below) is never proxied.
    location /auth/dev/ {
        proxy_pass http://backend:8000/auth/dev/;
        proxy_set_header Host $host;
    }

    # SPA fallback: unknown paths (including /auth/callback) resolve
    # to index.html so vue-router's history mode works on a refresh
    # or a deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
