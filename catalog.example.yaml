# Example adriano catalog configuration.
#
# Copy to catalog.yaml (or point ADRIANO_CONFIG_FILE at a copy) and
# adjust for your deployment. This file is read once at startup (by
# the web app and by every `adriano` CLI run); changing it requires an
# application restart. Validate it with `task check-config` (or
# `adriano check-config`), which prints every registration, the policy
# status and all problems, and exits non-zero on errors.
#
# Problems never stop startup: an invalid source entry disables only
# that registration (with a readable `config_error`), and a missing or
# invalid approval_policy blocks decisions until it is fixed.
#
# Secrets referenced below (source access tokens, CI push tokens) are
# environment variable NAMES, resolved at startup. Never put an
# actual secret value in this file.
#
# Common fields of every source entry:
#   id              stable registration id (letters, digits, . _ -)
#   type            filesystem | gitlab
#   path            ADR path inside each project (default doc/decisions)
#   published_ref   explicit published ref label/branch (required)
#   scope           type-specific project filter (optional)
#   intake          [poll], [push] or [poll, push] (default [poll])
#   push_tokens_env env var names of the CI push bearer tokens
# Earlier entries own a (project, path) first: if two registrations
# yield the same file, the first one in this list keeps it.

sources:
  # A filesystem source reads ADR files from a folder mounted into
  # the container. It suits folder-only deployments as well as demos
  # and tests.
  - id: central
    type: filesystem
    # Relative paths are resolved against this file's directory.
    root: ./samples/adr-root
    # Optional filter: only index these project subdirectories.
    scope:
      projects: [platform, payments]
    # Path to the ADRs inside each project directory.
    path: doc/decisions
    # Explicit label for the "published" ref of this registration.
    published_ref: local
    # This registration accepts both scheduled polling and CI push.
    intake: [poll, push]
    # Env var NAMES holding the CI push bearer tokens for this
    # registration (never the token values themselves).
    push_tokens_env: [ADRIANO_PUSH_TOKEN_CENTRAL]

  # A gitlab source reads ADR files from one or more GitLab groups
  # or projects over the GitLab REST API. The registration stays
  # disabled until the token env var below is set.
  - id: gitlab-platform
    type: gitlab
    # Instance URL; https:// only (TLS is always verified).
    base_url: https://gitlab.example.com
    # Env var NAME holding the GitLab personal/project access token
    # (read_api scope suffices).
    token_env: ADRIANO_GITLAB_TOKEN_PLATFORM
    # Group paths (all their non-archived projects; descendants too
    # with include_subgroups, default false) and/or full project
    # paths. At least one group or project is required.
    scope:
      groups: [platform]
      include_subgroups: true
      projects: []
    path: doc/decisions
    # Either an explicit branch name, or "@project-default" to use
    # each project's configured default branch.
    published_ref: "@project-default"
    intake: [poll, push]
    push_tokens_env: [ADRIANO_PUSH_TOKEN_PLATFORM]

# The single global approval policy. A missing or invalid policy
# does not stop startup; it yields the policy_missing state
# everywhere instead, and decisions are refused until it is fixed.
approval_policy:
  id: global
  version: 1
  required: true
  reviewers:
    # issuer|subject pairs, matched against the verified token.
    users: ["https://idp.example.com|subject-123"]
    # IdP roles that are also eligible to review.
    roles: [adr-reviewer]
  allow_self_approval: false

# Maps each IdP role (as it appears in the roles claim selected by
# ADRIANO_OIDC_ROLES_CLAIM, default `roles`) to the permissions it
# grants:
#   read     browse and search the catalog (every GET /api/v1 route)
#   operate  trigger polls (POST /api/v1/sources/poll and
#            POST /api/v1/sources/{id}/poll)
# Permissions do not imply each other: give operators both. Reviewing
# is NOT a permission; it comes from approval_policy.reviewers only.
# Deny by default: a role not listed here, or a missing/invalid rbac
# section, grants nothing (reported by check-config and as
# `rbac: empty` in /healthz). GET /api/v1/me needs no permission.
rbac:
  roles:
    admin: [read, operate]
    adr-reader: [read]
