name: testing

# Reusable test suite: backend (ruff + pytest against PostgreSQL 18),
# frontend (eslint + vitest + production build) and the release-script
# self-tests. It is called by image.yml, which owns the pull_request,
# push and tag triggers; listing those triggers here too would run
# every suite twice per event. `workflow_dispatch` lets a maintainer
# run it by hand on any branch.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: adriano
          POSTGRES_PASSWORD: adriano
          POSTGRES_DB: adriano
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adriano -d adriano"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ADRIANO_DATABASE_URL: postgresql://adriano:adriano@localhost:5432/adriano
      ADRIANO_TEST_DATABASE_URL: >-
        postgresql://adriano:adriano@localhost:5432/adriano_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the backend dependencies
        # uv reads the Python version from backend/.python-version.
        run: uv sync --project backend

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check .

      - name: Create the test database
        # Same as `task db:create-test-db`: the suite runs against
        # adriano_test, never against the application database.
        env:
          PGPASSWORD: adriano
        run: >
          psql -h localhost -U adriano -d adriano
          -c 'CREATE DATABASE adriano_test'

      - name: Run the tests
        working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep in step with `FROM node:24-slim` in the Dockerfile.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run the tests
        # Same as `task test:frontend`: the unit tests must not depend
        # on a dev-login flag.
        run: env -u VITE_DEV_AUTH npm run test

      - name: Build
        # Also fails if dev-login code leaked into dist/.
        run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the release scripts
        run: scripts/tests/test_release_scripts.sh

  k8s:
    runs-on: ubuntu-latest
    env:
      # Pinned tool versions; bump deliberately.
      KUBECONFORM_VERSION: v0.8.0
      KUSTOMIZE_VERSION: v5.8.3
      KUBERNETES_VERSION: 1.34.0
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform and kustomize
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate the example manifests
        # Schema check only (no cluster): the rendered kustomization
        # must be valid Kubernetes API objects.
        run: >
          kustomize build deploy/kubernetes
          | kubeconform -strict -summary
          -kubernetes-version "$KUBERNETES_VERSION"
