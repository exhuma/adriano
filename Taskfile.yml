version: "3"

dotenv: [".env"]

vars:
  # Shell fragment: make a relative ADRIANO_CONFIG_FILE (from .env or
  # the caller's environment; default catalog.yaml) absolute against
  # the repository root, so every task resolves the same file no
  # matter which `dir:` it runs in (dev:backend runs in backend/).
  # Task's `sh:` vars cannot see dotenv values, so this is spliced
  # into each command instead.
  RESOLVE_CONFIG: >-
    adriano_cfg="${ADRIANO_CONFIG_FILE:-catalog.yaml}";
    case "$adriano_cfg" in
    /*) ;;
    *) adriano_cfg="{{.ROOT_DIR}}/$adriano_cfg" ;;
    esac;
    export ADRIANO_CONFIG_FILE="$adriano_cfg"

tasks:
  frontend:install:
    desc: >-
      Install the frontend dependencies with `npm ci` (skipped while
      node_modules matches package.json / package-lock.json).
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci

  db:up:
    desc: >-
      Start the ephemeral dev/test Postgres container (no-op if
      already running).
    status:
      - test -n "$(docker ps -q -f name=^/adriano-db$ -f status=running)"
    cmds:
      - >-
        docker run -d --rm --name adriano-db -p 55432:5432
        --tmpfs /var/lib/postgresql
        -e POSTGRES_USER=adriano
        -e POSTGRES_PASSWORD=adriano
        -e POSTGRES_DB=adriano
        postgres:18
      - task: db:wait-ready
      - task: db:create-test-db

  db:wait-ready:
    internal: true
    desc: Wait for the dev Postgres container to accept connections.
    cmds:
      - |
        for i in $(seq 1 30); do
          if docker exec adriano-db pg_isready -U adriano \
              -d adriano >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "adriano-db did not become ready in time" >&2
        exit 1

  db:create-test-db:
    internal: true
    desc: Create the adriano_test database if it does not exist yet.
    cmds:
      - |
        exists=$(docker exec adriano-db psql -U adriano -d adriano \
          -tAc "SELECT 1 FROM pg_database WHERE datname='adriano_test'")
        if [ "$exists" != "1" ]; then
          docker exec adriano-db psql -U adriano -d adriano \
            -c 'CREATE DATABASE adriano_test'
        fi

  db:down:
    desc: Stop and discard the ephemeral dev/test Postgres container.
    cmds:
      - docker stop adriano-db >/dev/null 2>&1 || true

  db:reset:
    desc: Discard and recreate the ephemeral dev/test Postgres container.
    cmds:
      - task: db:down
      - task: db:up

  migrate:
    desc: Apply Alembic migrations to the dev database.
    dir: backend
    cmds:
      - uv run alembic upgrade head

  dev:
    desc: >-
      Start the ephemeral DB, apply migrations, then run the backend
      (8100) and frontend (5173) dev servers in parallel. Ctrl-C stops
      both servers; the DB keeps running until `task db:down`.
    cmds:
      - task: db:up
      - task: migrate
      - task: dev:servers

  dev:servers:
    internal: true
    deps: [dev:backend, dev:frontend]

  dev:backend:
    desc: Run the FastAPI dev server with reload on port 8100.
    dir: backend
    cmds:
      - |
        {{.RESOLVE_CONFIG}}
        uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8100

  dev:frontend:
    desc: >-
      Run the Vite dev server on port 5173 (skips gracefully until
      the frontend is scaffolded).
    deps: [frontend:install]
    cmds:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "frontend/package.json not found; skipping" \
            "dev:frontend (frontend not scaffolded yet)."
          exit 0
        fi
        cd frontend && npm run dev

  poll:
    desc: >-
      Poll all source registrations into the dev database (pass
      `-- --source ID` for one). Reads ADRIANO_CONFIG_FILE (default
      ./catalog.yaml in the repository root).
    cmds:
      - |
        {{.RESOLVE_CONFIG}}
        uv run --project backend adriano poll {{.CLI_ARGS}}

  check-config:
    desc: >-
      Validate the catalog configuration (ADRIANO_CONFIG_FILE, default
      ./catalog.yaml) and print registrations, policy and problems.
    cmds:
      - |
        {{.RESOLVE_CONFIG}}
        uv run --project backend adriano check-config

  mint-dev-token:
    desc: >-
      Print a dev-only HS256 access token signed with
      ADRIANO_DEV_SHARED_SECRET (from .env), e.g.
      `task mint-dev-token -- --sub alice --roles admin`.
    cmds:
      - uv run --project backend adriano mint-dev-token {{.CLI_ARGS}}

  bench:seed:
    desc: >-
      Reset and migrate the ephemeral dev database (NEVER the test
      database), then seed the deterministic synthetic benchmark ADR
      corpus into it via `adriano seed-synthetic` (default 20,000
      records / 100 projects; override with e.g.
      `task bench:seed -- --records 2000 --projects 100`). See
      bench/catalog.bench.yaml and docs/benchmark.md.
    cmds:
      - task: db:reset
      - task: migrate
      - |
        ADRIANO_CONFIG_FILE=bench/catalog.bench.yaml \
          uv run --project backend adriano seed-synthetic \
          --source-id synthetic --records 20000 --projects 100 \
          {{.CLI_ARGS}}

  bench:
    desc: >-
      End-to-end search/browse latency benchmark (SPEC.md "Phase 1
      acceptance", P95 target): `task bench:seed` (20,000 records /
      100 projects), start the backend (uvicorn, 4 workers like the
      container default, port 8100, dev auth with a throwaway
      secret, ADRIANO_CONFIG_FILE=bench/catalog.bench.yaml), run
      backend/bench/bench.py at concurrency 1 and 8, then stop the
      backend. Pass bench.py args after `--`, e.g.
      `task bench -- --requests 500` (to reseed a different size
      first, run `task bench:seed -- --records N --projects M`
      yourself, then `task bench -- --requests 500`, since this task
      always reseeds the default 20,000/100 size). Results:
      bench-results.json plus the table on stdout. See
      docs/benchmark.md.
    cmds:
      # A plain shell call (not `task: bench:seed`), so this task's
      # own CLI_ARGS (meant for bench.py below) are not also passed
      # to bench:seed.
      - task bench:seed
      - |
        set -e
        export ADRIANO_CONFIG_FILE=bench/catalog.bench.yaml
        export ADRIANO_DEV_AUTH_ENABLED=true
        export ADRIANO_DEV_SHARED_SECRET="$(python3 -c \
          'import secrets; print(secrets.token_hex(32))')"
        export ADRIANO_WORKERS=4
        uv run --project backend uvicorn app.main:app \
          --host 0.0.0.0 --port 8100 --workers "$ADRIANO_WORKERS" \
          > /tmp/adriano-bench-backend.log 2>&1 &
        backend_pid=$!
        # `kill $backend_pid` alone only stops the `uv run` wrapper,
        # not the uvicorn worker processes it execs as children, so
        # also pkill by the exact command line.
        trap '
          kill "$backend_pid" 2>/dev/null || true
          pkill -f "uvicorn app.main:app.*--port 8100" 2>/dev/null \
            || true
        ' EXIT
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:8100/healthz >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        uv run --project backend python backend/bench/bench.py \
          --base-url http://localhost:8100 --out bench-results.json \
          {{.CLI_ARGS}}

  lint:
    desc: Lint and format-check the backend and the frontend.
    cmds:
      - cd backend && uv run ruff check .
      - cd backend && uv run ruff format --check .
      - task: lint:frontend

  lint:frontend:
    internal: true
    deps: [frontend:install]
    cmds:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "frontend/package.json not found; skipping frontend" \
            "lint/typecheck (frontend not scaffolded yet)."
          exit 0
        fi
        cd frontend && npm run lint && npm run typecheck

  test:
    desc: Run the backend and frontend test suites.
    cmds:
      - cd backend && uv run pytest
      - task: test:frontend

  test:frontend:
    internal: true
    deps: [frontend:install]
    cmds:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "frontend/package.json not found; skipping frontend" \
            "tests (frontend not scaffolded yet)."
          exit 0
        fi
        # A developer's .env may set VITE_DEV_AUTH=true for `task dev`;
        # unit tests must not depend on it.
        cd frontend && env -u VITE_DEV_AUTH npm run test

  build:
    desc: Build the production frontend bundle.
    deps: [frontend:install]
    cmds:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "frontend/package.json not found; skipping build" \
            "(frontend not scaffolded yet)."
          exit 0
        fi
        cd frontend && npm run build

  demo:env:
    internal: true
    desc: >-
      Generate the gitignored .env.demo (dev auth + a push token) for
      the local demo stack, if it does not already exist. Never
      commit this file.
    status:
      - test -f .env.demo
    cmds:
      - |
        python3 - <<'PY'
        import secrets

        with open(".env.demo", "w", encoding="utf-8") as fh:
            fh.write(
                "# Generated by `task demo`. DEV AUTH ONLY. Never\n"
                "# commit this file (see .gitignore) and never reuse\n"
                "# these values outside a throwaway local demo.\n"
            )
            fh.write("ADRIANO_DEV_AUTH_ENABLED=true\n")
            fh.write(
                f"ADRIANO_DEV_SHARED_SECRET={secrets.token_hex(32)}\n"
            )
            fh.write(
                "ADRIANO_PUSH_TOKEN_CENTRAL="
                f"{secrets.token_urlsafe(32)}\n"
            )
        PY
        echo "Generated .env.demo."

  demo:build:
    internal: true
    cmds:
      - docker compose build

  demo:up:
    internal: true
    dotenv: [".env.demo"]
    env:
      # The backend's env_file (catalog-referenced secrets such as
      # ADRIANO_PUSH_TOKEN_CENTRAL); see docker-compose.yml.
      ADRIANO_BACKEND_ENV_FILE: .env.demo
    cmds:
      - docker compose up -d
      - task: demo:wait-health

  demo:wait-health:
    internal: true
    desc: Wait until the demo stack's frontend/backend answer healthy.
    dotenv: [".env.demo"]
    cmds:
      - |
        port="${ADRIANO_FRONTEND_PORT:-8180}"
        for i in $(seq 1 60); do
          if curl -fsS "http://localhost:${port}/healthz" \
              >/dev/null 2>&1; then
            echo "demo stack is healthy."
            exit 0
          fi
          sleep 2
        done
        echo "timed out waiting for the demo stack to become healthy;" \
          "see \`docker compose ps\` / \`docker compose logs\`." >&2
        exit 1

  demo:poll:
    desc: >-
      Poll the demo stack's source registrations (the bundled
      samples/adr-root/ tree) into its running database.
    cmds:
      - docker compose exec backend adriano poll

  demo:print-info:
    internal: true
    dotenv: [".env.demo"]
    cmds:
      - |
        port="${ADRIANO_FRONTEND_PORT:-8180}"
        echo
        echo "adriano demo is up:"
        echo "  Frontend:  http://localhost:${port}/"
        echo "  Healthz:   http://localhost:${port}/healthz"
        echo
        echo "The frontend container is a PRODUCTION build (no"
        echo "dev-login UI). To sign in interactively, run" \
          "\`task demo:ui\` in another terminal (a Vite dev server" \
          "with dev login, proxying to this same demo backend)."
        echo
        echo "Or mint a token on the command line:"
        echo '  docker compose exec backend adriano mint-dev-token \'
        echo '    --sub alice --roles admin'
        echo
        echo "Push a candidate (CI push demo; see samples/push-" \
          "candidate.sh and docs/operator.md):"
        echo "  export ADRIANO_PUSH_TOKEN_CENTRAL=\$(grep" \
          "ADRIANO_PUSH_TOKEN_CENTRAL .env.demo | cut -d= -f2)"
        echo "  ADRIANO_API_BASE_URL=http://localhost:${port} \\"
        echo "    samples/push-candidate.sh \\"
        echo "    samples/candidates/2026-01-05-use-redis-for-caching.md \\"
        echo "    platform feature/redis-cache"
        echo
        echo "Stop and discard the demo stack: task demo:down"

  demo:
    desc: >-
      Build and start the full containerised demo stack (dev auth
      ENABLED for this local demo only; see docs/operator.md "Dev
      auth must be unset in prod"), wait for health, run an initial
      poll, and print how to sign in / push candidates.
    cmds:
      - task: demo:env
      - task: demo:build
      - task: demo:up
      - task: demo:poll
      - task: demo:print-info

  demo:down:
    desc: Stop and discard the demo stack (compose down -v).
    cmds:
      - docker compose down -v

  demo:ui:
    desc: >-
      Run the Vite dev server with dev login enabled, proxying to
      the running demo stack's backend (the demo's nginx container
      is a production build with no dev-login UI; use this for an
      interactive sign-in against the same demo data).
    dotenv: [".env.demo"]
    dir: frontend
    deps: [frontend:install]
    cmds:
      - |
        if [ ! -f package.json ]; then
          echo "frontend/package.json not found; skipping demo:ui."
          exit 0
        fi
        port="${ADRIANO_FRONTEND_PORT:-8180}"
        export VITE_DEV_AUTH=true
        export VITE_DEV_PROXY_TARGET="http://localhost:${port}"
        npm run dev -- --port 5180
